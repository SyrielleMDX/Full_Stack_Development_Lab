<!DOCTYPE html>
<html>
<head>
    <title>Vue Like Button</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

    <style>
        .like-button {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
        }

        .liked {
            color: red;
        }
    </style>
</head>

<body>

<div id="app">

    <div class="post">
        <h3>Cute Penguin</h3>
        <p>This is an example social media post.</p>

        <button class="like-button"
                @click="toggleLike">

            <i :class="liked ? 'fa fa-heart liked' : 'fa fa-heart-o'"></i>

            {{ likes }}
        </button>
    </div>

</div>

<script>
    new Vue({
        el: '#app',

        data: {
            likes: 100,
            liked: false
        },

        methods: {
            toggleLike: function() {

                if (this.liked) {
                    this.likes--;
                    this.liked = false;
                } else {
                    this.likes++;
                    this.liked = true;
                }

            }
        }
    });
</script>

</body>
</html>
